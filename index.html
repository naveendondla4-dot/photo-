<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Pop Photo Reveal</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#finalImage {
    position: fixed;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
}

#error {
    display: none;
    position: fixed;
    inset: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<img id="finalImage" alt="">
<div id="error">
    <h2>Image not found</h2>
    <p>Put this image in the same folder as index.html:</p>
    <strong id="errorName"></strong>
</div>

<script>
/* ---------- SETTINGS ---------- */

// Your photo file name (must be in the SAME folder as index.html)
const IMAGE_NAME = "myphoto.jpg";

const REVEAL_TIME   = 6000;  // total reveal time (ms)
const PARTICLE_STEP = 5;     // distance between pixels
const PARTICLE_SIZE = 3;     // pixel size
const POP_DURATION  = 350;   // pop time of each pixel (ms)
const BRIGHTNESS    = 1.22;  // brightness boost

/* ---------- SETUP ---------- */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const finalImage = document.getElementById("finalImage");

const image = new Image();

let width = 0, height = 0;
let imageWidth = 0, imageHeight = 0;
let imageX = 0, imageY = 0;
let particles = [];
let animationStart = 0;
let finished = false;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // Keep photo placement correct if the window size changes
    if (image.complete && image.naturalWidth) {
        const oldX = imageX, oldY = imageY;
        calculateImage();
        const dx = imageX - oldX, dy = imageY - oldY;
        for (const p of particles) { p.x += dx; p.y += dy; }
        if (finished) drawAll();
    }
}
window.addEventListener("resize", resize);
resize();

image.onload = function () {
    calculateImage();
    try {
        createParticles();
    } catch (e) {
        // Happens when index.html is opened directly from disk (file://).
        // Online (GitHub Pages) this works. Fallback: just show the photo.
        console.warn("Pixel effect needs a web server / GitHub Pages:", e);
        finalImage.style.opacity = "1";
        return;
    }
    setTimeout(startAnimation, 300);
};

image.onerror = function () {
    canvas.style.display = "none";
    finalImage.style.display = "none";
    document.getElementById("errorName").textContent = IMAGE_NAME;
    document.getElementById("error").style.display = "block";
};

image.src = IMAGE_NAME;
finalImage.src = IMAGE_NAME;

/* ---------- IMAGE POSITION (cover) ---------- */

function calculateImage() {
    const ow = image.naturalWidth;
    const oh = image.naturalHeight;

    const scale = Math.max(width / ow, height / oh);

    imageWidth  = Math.ceil(ow * scale);
    imageHeight = Math.ceil(oh * scale);

    imageX = Math.floor((width  - imageWidth)  / 2);
    imageY = Math.floor((height - imageHeight) / 2);

    finalImage.style.width  = imageWidth  + "px";
    finalImage.style.height = imageHeight + "px";
    finalImage.style.left   = imageX + "px";
    finalImage.style.top    = imageY + "px";
}

/* ---------- PARTICLES ---------- */

function createParticles() {
    particles = [];

    const tempCanvas = document.createElement("canvas");
    const tempCtx = tempCanvas.getContext("2d", { willReadFrequently: true });
    tempCanvas.width = imageWidth;
    tempCanvas.height = imageHeight;
    tempCtx.drawImage(image, 0, 0, imageWidth, imageHeight);

    const data = tempCtx.getImageData(0, 0, imageWidth, imageHeight).data;

    for (let y = 0; y < imageHeight; y += PARTICLE_STEP) {
        for (let x = 0; x < imageWidth; x += PARTICLE_STEP) {

            const i = (y * imageWidth + x) * 4;
            if (data[i + 3] < 80) continue;           // skip transparent

            const r = Math.min(255, data[i]     * BRIGHTNESS);
            const g = Math.min(255, data[i + 1] * BRIGHTNESS);
            const b = Math.min(255, data[i + 2] * BRIGHTNESS);

            particles.push({
                x: imageX + x,
                y: imageY + y,
                color: "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")",
                size: PARTICLE_SIZE,
                delay: Math.random() * (REVEAL_TIME - POP_DURATION)
            });
        }
    }
}

function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

/* ---------- ANIMATION ---------- */

function startAnimation() {
    animationStart = performance.now();
    requestAnimationFrame(animate);
}

function animate(timestamp) {
    const elapsed = Math.max(0, timestamp - animationStart);

    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const localTime = elapsed - p.delay;
        if (localTime <= 0) continue;

        const progress = Math.min(1, localTime / POP_DURATION);
        const size = Math.max(0, p.size * easeOutBack(progress));

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    }

    if (elapsed < REVEAL_TIME + POP_DURATION) {
        requestAnimationFrame(animate);
    } else {
        finishReveal();
    }
}

function drawAll() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
}

function finishReveal() {
    finished = true;
    drawAll();
    setTimeout(revealPhoto, 700);   // small pause, then fade in real photo
}

function revealPhoto() {
    finalImage.style.opacity = "1"; // only fade, no movement
}
</script>

</body>
</html>
